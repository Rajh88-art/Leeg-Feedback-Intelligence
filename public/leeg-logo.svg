<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leegForestGrad" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#A8CBB7" />
      <stop offset="40%" stop-color="#6F9B86" />
      <stop offset="75%" stop-color="#2D6A58" />
      <stop offset="100%" stop-color="#123D32" />
    </linearGradient>
    <linearGradient id="leegHighlightGrad" x1="30%" y1="15%" x2="45%" y2="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#D7E8DF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0B2822" stroke="#1E4D40" stroke-width="2"/>

  <!-- Shadow -->
  <path
    d="M 32 32 C 34 22 44 14 54 14 C 61 14 65 19 63 26 C 60 37 49 57 44 72 C 42 78 40 84 45 85 C 50 86 61 82 72 79 C 76 78 81 77 84 80 C 85 82 84 84 81 85 C 67 90 51 92 40 89 C 32 87 31 78 34 70 C 39 56 50 36 53 26 C 54 22 52 19 48 20 C 42 21 35 28 32 32 Z"
    fill="#051411"
    opacity="0.55"
    transform="translate(1.5, 2)"
  />

  <!-- Main Cursive L Body -->
  <path
    d="M 32 32 C 34 22 44 14 54 14 C 61 14 65 19 63 26 C 60 37 49 57 44 72 C 42 78 40 84 45 85 C 50 86 61 82 72 79 C 76 78 81 77 84 80 C 85 82 84 84 81 85 C 67 90 51 92 40 89 C 32 87 31 78 34 70 C 39 56 50 36 53 26 C 54 22 52 19 48 20 C 42 21 35 28 32 32 Z"
    fill="url(#leegForestGrad)"
  />

  <!-- Inner Highlight -->
  <path
    d="M 45 22 C 50 17 55 16 57 20 C 58 24 55 33 50 48 C 46 60 43 72 44 78"
    stroke="url(#leegHighlightGrad)"
    stroke-width="1.8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Flourish loop at base -->
  <path
    d="M 37 76 C 35 81 37 86 42 86 C 50 86 62 82 75 79"
    stroke="#D7E8DF"
    stroke-width="0.9"
    stroke-linecap="round"
    stroke-opacity="0.7"
    fill="none"
  />

  <!-- Sparkle Accents -->
  <g filter="url(#starGlow)">
    <polygon points="78,14 80,21 87,23 80,25 78,32 76,25 69,23 76,21" fill="#E3F1E8"/>
    <circle cx="78" cy="23" r="1.2" fill="#FFFFFF" />
  </g>
  <g filter="url(#starGlow)">
    <polygon points="20,44 21.5,48.5 26,50 21.5,51.5 20,56 18.5,51.5 14,50 18.5,48.5" fill="#B5D3C2"/>
    <circle cx="20" cy="50" r="0.9" fill="#FFFFFF" />
  </g>
  <g filter="url(#starGlow)">
    <polygon points="88,68 89.5,72.5 94,74 89.5,75.5 88,80 86.5,75.5 82,74 86.5,72.5" fill="#D7E8DF"/>
    <circle cx="88" cy="74" r="1" fill="#FFFFFF" />
  </g>
</svg>
